# ABOUT ME SECTION
# show_aboutme_card:
# > setting this to true, will display the About Me section
# > setting this to false, will omit the About Me section
show_aboutme_card: true
# about_me_title: The will be displayed as the title in the About Me section
about_me_title: WhoAmI
about_me_title_es: WhoAmI
# about_me_description: This will be displayed under the title.
about_me_description: "Offensive Security Expert with a Master's degree in Cyber Security from the University of Birmingham and 10+ years of experience across mobile, API, cloud, and infrastructure security. Currently leading offensive security operations at a Latin American fintech, with deep specialization in Android security research — including RASP bypass, KYC biometric evasion, and mobile application reverse engineering using dynamic instrumentation.<br><br>Former security engineer at CERN, where I focused on web penetration testing and vulnerability analysis for critical research infrastructure. My work spans the full offensive security lifecycle: from attack surface reconnaissance and vulnerability discovery to exploitation, reporting, and remediation guidance. I hold industry certifications including CEH, eJPT, and CAPIPEN, and have presented original security research at international conferences including <b>DEF CON 34</b> (Las Vegas), <b>BSides Colombia</b>, and <b>PWN or DIE</b> (Ecuador). At DEF CON 34 I presented 'Your Bank Thinks I'm You: A Complete Kill Chain Against Mobile Banking Security', and at BSides Colombia and PWN or DIE I presented 'Your Brain > Your Toolkit: Real Bugs, Zero Code, Zero Tools', a talk on finding critical vulnerabilities through pure logical reasoning without automated tooling."
about_me_description_es: "Experto en Seguridad Ofensiva con una Maestría en Ciberseguridad de la Universidad de Birmingham y más de 10 años de experiencia en seguridad móvil, API, cloud e infraestructura. Actualmente lidero operaciones de seguridad ofensiva en una fintech latinoamericana, con especialización en investigación de seguridad Android — incluyendo bypass de RASP, evasión biométrica KYC e ingeniería inversa de aplicaciones móviles mediante instrumentación dinámica.<br><br>Ex ingeniero de seguridad en el CERN, donde me enfoqué en pentesting web y análisis de vulnerabilidades para infraestructura crítica de investigación. Mi trabajo abarca todo el ciclo de vida de seguridad ofensiva: desde reconocimiento de superficie de ataque y descubrimiento de vulnerabilidades hasta explotación, reporte y guía de remediación. Poseo certificaciones CEH, eJPT y CAPIPEN, y he presentado investigación original en conferencias internacionales como <b>DEF CON 34</b> (Las Vegas), <b>BSides Colombia</b> y <b>PWN or DIE</b> (Ecuador). En DEF CON 34 presenté 'Your Bank Thinks I'm You: A Complete Kill Chain Against Mobile Banking Security', y en BSides Colombia y PWN or DIE presenté 'Your Brain > Your Toolkit: Real Bugs, Zero Code, Zero Tools', una charla sobre encontrar vulnerabilidades críticas mediante razonamiento lógico puro sin herramientas automatizadas."

