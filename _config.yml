# ABOUT ME SECTION
# show_aboutme_card:
# > setting this to true, will display the About Me section
# > setting this to false, will omit the About Me section
show_aboutme_card: true
# about_me_title: The will be displayed as the title in the About Me section
about_me_title: WhoAmI
about_me_title_es: WhoAmI
# about_me_description: This will be displayed under the title.
about_me_description: "Offensive security isn't about finding bugs — it's about proving what's actually exploitable. With 10+ years of experience spanning software development and security, I work across web, API, mobile, and cloud environments, helping teams identify real attack paths and turn findings into stronger security controls.<br><br>My focus is application security and penetration testing: exploiting business logic flaws, authentication and authorization weaknesses, and validating high-risk flows — then translating findings into remediation that engineering teams actually implement. I also leverage AI-augmented security workflows, including LLM-assisted vulnerability discovery and OWASP LLM Top 10 testing. I hold an MSc in Cyber Security with Distinction from the University of Birmingham and previously worked as a Security Engineer (Penetration Testing) at CERN.<br><br>Outside of work, I share what I learn with the community: speaking at well-known security conferences including <b>DEF CON 34</b> (Las Vegas), <b>BSides Colombia</b>, and <b>PWN or DIE</b> (Ecuador), publishing research, and creating open security testing resources."
about_me_description_es: "La seguridad ofensiva no es encontrar bugs — es demostrar qué es realmente explotable. Con más de 10 años de experiencia entre desarrollo de software y seguridad, trabajo en entornos web, API, mobile y cloud, ayudando a equipos a identificar rutas de ataque reales y convertir hallazgos en controles de seguridad más fuertes.<br><br>Mi enfoque es la seguridad de aplicaciones y el penetration testing: explotar fallas de lógica de negocio, debilidades de autenticación y autorización, y validar flujos de alto riesgo — luego traduzco los hallazgos en remediación que los equipos de ingeniería realmente implementan. También utilizo flujos de trabajo de seguridad aumentada por IA, incluyendo descubrimiento de vulnerabilidades asistido por LLM y testing OWASP LLM Top 10. Tengo un MSc en Cyber Security con Distinción de la University of Birmingham y trabajé como Security Engineer (Penetration Testing) en el CERN.<br><br>Fuera del trabajo, comparto lo que aprendo con la comunidad: hablando en conferencias de seguridad reconocidas como <b>DEF CON 34</b> (Las Vegas), <b>BSides Colombia</b> y <b>PWN or DIE</b> (Ecuador), publicando investigación y creando recursos abiertos de security testing."

