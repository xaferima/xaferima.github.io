<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="https://xaferima.com{{ page.permalink }}" />
  <link rel="alternate" hreflang="en" href="https://xaferima.com{{ page.permalink | replace: '-es.html', '.html' | replace: '/reportes/', '/reportes/' }}" />
  <link rel="alternate" hreflang="es" href="https://xaferima.com{{ page.permalink }}" />
  <link rel="alternate" hreflang="x-default" href="https://xaferima.com{{ page.permalink | replace: '-es.html', '.html' }}" />

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="https://xaferima.com{{ page.permalink }}">
  <meta property="og:image" content="https://xaferima.com/assets/img/og-image.png">
  <meta property="og:site_name" content="xaferima.com">
  <meta property="og:locale" content="es_EC">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="article:author" content="https://xaferima.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@xaferima">
  <meta name="twitter:creator" content="@xaferima">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">

  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-touch-icon.png" | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | prepend: site.baseurl }}">
  <link rel="manifest" href="{{ "/assets/favicon/site.webmanifest" | prepend: site.baseurl }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/main.min.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/css/vendors.min.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/css/reportes.css" | prepend: site.baseurl }}">

  <script src="{{ "/assets/js/vendors.min.js" | prepend: site.baseurl }}"></script>
  <script>if(window.particlesJS)window.particlesJS.load=function(){};</script>
  <script src="{{ "/assets/js/app.min.js" | prepend: site.baseurl }}"></script>

  <!-- JSON-LD: Article -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | escape }}",
    "url": "https://xaferima.com{{ page.permalink }}",
    "author": {
      "@type": "Person",
      "name": "Xavier Riofrio",
      "url": "https://xaferima.com"
    },
    "publisher": {
      "@type": "Organization",
      "name": "xaferima.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://xaferima.com/assets/img/og-image.png"
      }
    },
    "datePublished": "2026-11-06",
    "dateModified": "2026-11-06",
    "inLanguage": "es",
    "about": {
      "@type": "Thing",
      "name": "Divulgación de Vulnerabilidades"
    }
  }
  </script>

  <!-- JSON-LD: BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [{
      "@type": "ListItem",
      "position": 1,
      "name": "Inicio",
      "item": "https://xaferima.com/index-es.html"
    },{
      "@type": "ListItem",
      "position": 2,
      "name": "Informes de Seguridad",
      "item": "https://xaferima.com/reportes/"
    },{
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title | escape }}",
      "item": "https://xaferima.com{{ page.permalink }}"
    }]
  }
  </script>

  <!-- Google Search Console verification (placeholder) -->
  <meta name="google-site-verification" content="GSC_VERIFICATION_CODE_PLACEHOLDER" />
  <!-- Bing Webmaster Tools verification (placeholder) -->
  <meta name="msvalidate.01" content="BING_VERIFICATION_CODE_PLACEHOLDER" />
</head>
